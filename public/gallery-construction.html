<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Construction Gallery - Lanka Dream Homes Builders</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: #0b0b0b; color: #fff; line-height: 1.6; }
    header { padding: 20px 8%; display: flex; justify-content: space-between; align-items: center; position: fixed; width: 100%; top: 0; z-index: 100; background: rgba(0, 0, 0, 0.9); border-bottom: 1px solid rgba(255, 42, 42, 0.2); }
    header h1 { font-size: 1.2rem; font-weight: 700; color: #ff2a2a; letter-spacing: 1px; }
    nav a { color: #fff; margin-left: 25px; text-decoration: none; font-weight: 500; transition: 0.3s; font-size: 0.95rem; }
    nav a:hover { color: #ff2a2a; }
    .page-header { padding: 150px 10% 80px; text-align: center; background: linear-gradient(rgba(10, 0, 0, 0.8), rgba(40, 0, 0, 0.8)), url('idh_builders_bg.jpg') center/cover; }
    .page-header h2 { font-size: 3rem; color: #ffffff; text-transform: uppercase; margin-bottom: 10px; font-weight: 800; display: inline-block; padding: 15px 30px; background: rgba(0, 0, 0, 0.4); }
    .content-section { padding: 80px 10%; background: #ffffff; color: #111; min-height: 50vh; text-align: center; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .gallery-item { border-radius: 8px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); transition: 0.3s; height: 250px; }
    .gallery-item:hover { transform: scale(1.03); }
    .gallery-item img, .gallery-item video { width: 100%; height: 100%; object-fit: cover; }
    .back-btn { display: inline-block; margin-top: 50px; padding: 12px 30px; background: #111; color: #fff; text-decoration: none; border-radius: 4px; transition: 0.3s; font-weight: 600; }
    .back-btn:hover { background: #ff2a2a; }
    footer { text-align: center; padding: 25px; background: #050505; color: #666; font-size: 0.9rem; border-top: 1px solid #1a1a1a; }
    @media (max-width: 900px) { .page-header h2 { font-size: 2rem; } }
  </style>
</head>
<body>
  <header>
    <h1>Lanka Dream Homes Builders (Pvt) Ltd</h1>
    <nav>
      <a href="index.html#home">Home</a>
      <a href="index.html#services">Services</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>
  <div class="page-header">
    <h2>Construction Gallery</h2>
  </div>
  <section class="content-section">
    <div class="gallery-grid">
      <div class="gallery-item"><video src="assets/const_6.mp4" muted loop autoplay playsinline></video></div>
      <div class="gallery-item"><video src="assets/const_7.mp4" muted loop autoplay playsinline></video></div>
      <div class="gallery-item"><video src="assets/const_8.mp4" muted loop autoplay playsinline></video></div>
      <div class="gallery-item"><video src="assets/const_9.mp4" muted loop autoplay playsinline></video></div>
    </div>
    <a href="service-construction.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Construction</a>
  </section>
  <footer>© 2026 Lanka Dream Homes Builders (Pvt) Ltd. All Rights Reserved.</footer>

  <div class="contact-widget">
    <a href="https://wa.me/94777380125?text=Hello,%20I%20am%20interested%20in%20your%20services." class="widget-whatsapp" target="_blank">
      <i class="fa-brands fa-whatsapp"></i>
    </a>
    <a href="mailto:lankadreamhomesbuilders.lk@gmail.com?subject=Inquiry%20about%20Services&body=Hello,%20I%20would%20like%20to%20know%20more%20about%20your%20services." class="widget-email">
      <i class="fa-solid fa-envelope"></i>
    </a>
  </div>
</body>
</html>
